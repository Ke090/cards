<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta
      name="description"
      content="まわして、出会って、集めよう。無料で楽しめる小さなガチャの世界。"
    />
    <title>POCKET GACHA — 小さな出会いを、ポケットに。</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <main
        id="startup-status"
        role="status"
        style="max-width: 42rem; margin: 15vh auto; padding: 2rem; text-align: center; font-family: sans-serif; color: #263e37"
      >
        <h1 style="font-size: 1.5rem">POCKET GACHA</h1>
        <p>ゲームを読み込んでいます…</p>
      </main>
    </div>
    <script>
      window.addEventListener("error", function () {
        var status = document.getElementById("startup-status");
        if (!status) return;
        status.setAttribute("role", "alert");
        status.innerHTML =
          "<h1 style=\"font-size:1.5rem\">読み込みに失敗しました</h1>" +
          "<p>ページを再読み込みしてください。直らない場合は、ブラウザーのキャッシュを削除してからもう一度お試しください。</p>";
      }, true);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
